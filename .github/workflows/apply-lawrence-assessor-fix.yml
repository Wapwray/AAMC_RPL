name: Apply Lawrence assessor report fix

on:
  push:
    branches: [agent/fix-lawrence-assessor-report]
    paths: [.github/workflows/apply-lawrence-assessor-fix.yml]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-lawrence-assessor-report
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          generator = Path('public/rpl-final-report-generator.js')
          text = generator.read_text()

          start = text.index('  const normalizeAssessorQuestionList =')
          end = text.index('\n  const removeDuplicateAssessorQuestions =', start)
          replacement = '''  const parseJsonValue = (value) => {
            if (typeof value !== "string") return value;
            const text = value.trim();
            if (!text) return null;
            try { return JSON.parse(text); } catch { return value; }
          };

          const extractAssessorQuestionList = (rawPayload) => {
            const queue = [rawPayload];
            const visited = new Set();
            const wrapperKeys = ["AssessorQuestions", "assessorQuestions", "Assessor Questions", "questions", "value", "items", "listitems", "data", "body", "result", "response"];
            while (queue.length) {
              const candidate = parseJsonValue(queue.shift());
              if (!candidate) continue;
              if (Array.isArray(candidate)) return candidate;
              if (typeof candidate !== "object" || visited.has(candidate)) continue;
              visited.add(candidate);
              wrapperKeys.forEach((key) => {
                if (candidate[key] !== undefined && candidate[key] !== null) queue.push(candidate[key]);
              });
            }
            return [];
          };

          const normalizeAssessorQuestionList = (rawPayload, baseQuestionCount = 0) => {
            const list = extractAssessorQuestionList(rawPayload);
            if (!list.length) return [];

            const preNormalized = list
              .map((item) => {
                const titleValue = firstValue(item, ["Title", "title"]);
                const titleNumber = getNumericPrefix(titleValue);
                const explicitQuestionNumber = getNumericPrefix(firstValue(item, [
                  "questionNumber", "QuestionNumber", "question_number", "Question Number",
                  "questionNo", "QuestionNo", "question_no", "qNumber", "QNumber", "qNo", "QNo", "field_0",
                ]));
                const section = firstValue(item, ["field_1", "section", "Section", "category", "Category", "topic", "Topic"]) || "Assessor";
                const questionText = firstValue(item, ["field_2", "questionText", "question_text", "question", "Question", "Question Details", "title", "Title"]);
                const hints = firstValue(item, ["hints", "hint", "Hints", "Hint", "HintsHtml", "hintsHtml"]);
                const objective = joinObjectiveFields(item);
                if (!questionText) return null;
                return { titleValue, titleNumber, explicitQuestionNumber, section, questionText, hints: hints || "N/A", objective: objective || "N/A" };
              })
              .filter(Boolean);

            preNormalized.sort((a, b) => {
              const aNum = Number.isFinite(a.titleNumber) ? a.titleNumber : Number.MAX_SAFE_INTEGER;
              const bNum = Number.isFinite(b.titleNumber) ? b.titleNumber : Number.MAX_SAFE_INTEGER;
              if (aNum !== bNum) return aNum - bNum;
              return String(a.titleValue || "").localeCompare(String(b.titleValue || ""));
            });

            return preNormalized.map((item, index) => ({
              qNumber: String(Number.isFinite(item.explicitQuestionNumber) ? item.explicitQuestionNumber : Number.isFinite(item.titleNumber) ? item.titleNumber : baseQuestionCount + index + 1),
              section: item.section,
              questionText: item.questionText,
              hints: item.hints,
              objective: item.objective,
            }));
          };
          '''
          text = text[:start] + replacement + text[end:]

          start = text.index('  const removeDuplicateAssessorQuestions =')
          end = text.index('\n  const mergeCandidateMetadataIntoModel =', start)
          text = text[:start] + '''  const removeDuplicateAssessorQuestions = (assessorQuestions) => {
            const seen = new Set();
            return (Array.isArray(assessorQuestions) ? assessorQuestions : []).filter((item) => {
              const questionText = normalizeComparableText(item?.questionText);
              if (!questionText) return false;
              const key = `${cleanValue(item?.qNumber)}|${questionText}`;
              if (seen.has(key)) return false;
              seen.add(key);
              return true;
            });
          };
          ''' + text[end:]

          text = text.replace('removeDuplicateAssessorQuestions(assessorQuestions, model?.questions)', 'removeDuplicateAssessorQuestions(assessorQuestions)')
          text = text.replace('duplicate assessor question(s) already present in Question-by-Question Review.', 'duplicate item(s) within the assessor-question payload.')

          marker = '      return { html, model, validation, assessorQuestions };'
          validation = '''      if (assessorQuestions.length) {
                if (!html.includes('id="assessorQuestionsTitle"')) {
                  throw new Error("Generated report coverage validation failed: assessor questions were loaded but not rendered.");
                }
                const missing = assessorQuestions.find((item) => !html.includes(`data-question-number="${escapeHtml(item.qNumber)}"`));
                if (missing) throw new Error(`Generated report coverage validation failed: Assessor Question ${missing.qNumber} was not rendered.`);
              }

          '''
          if validation.strip() not in text:
            text = text.replace(marker, validation + marker, 1)
          generator.write_text(text)

          page_path = Path('public/RPL Report Generator - Assessor.html')
          page = page_path.read_text()
          block_start = page.index('        const directCandidates = [')
          block_end = page.index('\n\n        const transcriptText =', block_start)
          page = page[:block_start] + '''        const directCandidates = [
                  envelope,
                  envelope?.body,
                  safeJsonParse(envelope?.body),
                  safeJsonParse(envelope?.body?.["Full Transcription JSON"]),
                  safeJsonParse(envelope?.["Full Transcription JSON"]),
                  safeJsonParse(envelope?.body?.transcript),
                  safeJsonParse(envelope?.transcript),
                ].filter(Boolean);

                if (payload && typeof payload === "object") {
                  const candidatePayload = payload.candidate || payload.Candidate || payload.data?.candidate;
                  const questionPayload = payload.questions || payload.Questions || payload.data?.questions;
                  if (candidatePayload && Array.isArray(questionPayload)) directCandidates.push({ candidate: candidatePayload, questions: questionPayload });
                }

                const completeJsonCandidate = directCandidates
                  .filter((candidate) => candidate && typeof candidate === "object" && Array.isArray(candidate.questions))
                  .sort((left, right) => right.questions.length - left.questions.length)[0];

                if (completeJsonCandidate) {
                  transcriptInput = { kind: "json", text: "", json: completeJsonCandidate };
                  applyJsonMetadata(completeJsonCandidate);
                  return completeJsonCandidate.questions.length;
                }''' + page[block_end:]

          old = '''          const responsePayload = JSON.parse(responseText);
                    return responsePayload?.AssessorQuestions
                      ?? responsePayload?.assessorQuestions
                      ?? responsePayload?.["Assessor Questions"]
                      ?? [];'''
          new = '''          const responsePayload = JSON.parse(responseText);
                    const parsedBody = typeof responsePayload?.body === "string" ? safeJsonParse(responsePayload.body) : responsePayload?.body;
                    return responsePayload?.AssessorQuestions
                      ?? responsePayload?.assessorQuestions
                      ?? responsePayload?.["Assessor Questions"]
                      ?? parsedBody?.AssessorQuestions
                      ?? parsedBody?.assessorQuestions
                      ?? parsedBody?.["Assessor Questions"]
                      ?? responsePayload;'''
          if old not in page: raise SystemExit('assessor payload parser target missing')
          page = page.replace(old, new, 1)
          page_path.write_text(page)

          Path('tests/rplFinalReportGeneratorAssessorQuestions.test.js').write_text(r'''const test = require("node:test");
          const assert = require("node:assert/strict");
          global.window = {};
          require("../public/rpl-final-report-generator");
          const moduleUnderTest = global.window.RplFinalReportGenerator;

          test("keeps all assessor questions including overlapping Question 20", async () => {
            const q20 = "Explain how you review the effectiveness of the professional relationship and how you make changes to improve it.";
            const model = { metadata: {}, warnings: [], questions: [{ questionNumber: 20, questionAsked: q20 }] };
            const reportModule = {
              buildReportModelFromJsonTranscript: () => model,
              renderInteractiveReportHtml: () => '<main><section class="limitations">Limitations</section></main>',
              validateReportHtmlCoverage: () => ({ valid: true, questionCount: 20, statusRows: 20, articleCount: 20 }),
            };
            const questions = Array.from({ length: 20 }, (_, i) => ({ Title: String(i + 1).padStart(2, "0"), field_1: "Professional Relationships", field_2: i === 19 ? q20 : `Assessor question ${i + 1}`, Hints: `Hint ${i + 1}`, Objective: `Objective ${i + 1}` }));
            const generator = moduleUnderTest.create({ reportModule, callTextModel: async () => "{}", fetchAssessorQuestions: async () => ({ body: JSON.stringify({ AssessorQuestions: questions }) }) });
            const result = await generator.buildPreliminaryReviewReport({ jsonTranscript: { questions: [] } });
            assert.equal(result.assessorQuestions.length, 20);
            assert.match(result.html, /id="assessorQuestionsTitle"/);
            assert.match(result.html, /Assessor Question 20 - Professional Relationships/);
            assert.match(result.html, /data-question-number="20"/);
          });
          ''')
          Path('.github/workflows/apply-lawrence-assessor-fix.yml').unlink()
          PY
          node --check public/rpl-final-report-generator.js
          node --test tests/rplAssessorPage.test.js tests/rplFinalReportGeneratorAssessorQuestions.test.js
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix assessor questions and final transcript question"
          git push origin HEAD:agent/fix-lawrence-assessor-report
