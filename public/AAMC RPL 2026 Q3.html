<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AAMC RPL Quiz - Q3</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: auto;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f4f6f9;
        color: #0f172a;
      }

      .boot {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .bootCard {
        width: min(680px, 100%);
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
      }

      .bootTitle {
        margin: 0 0 8px;
        font-size: 18px;
      }

      .bootText {
        margin: 0;
        color: #475569;
        line-height: 1.5;
      }

      .bootAction {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 18px;
        padding: 12px 20px;
        border: 0;
        border-radius: 8px;
        background: #0877b7;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .bootAction:hover,
      .bootAction:focus-visible {
        background: #075f91;
      }

      .bootStatus {
        margin-top: 14px;
        color: #475569;
        line-height: 1.5;
      }

      .bootStatus.isError {
        color: #9b1c1c;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="boot">
      <section class="bootCard">
        <h1 class="bootTitle">Initialising</h1>
        <p class="bootText">Please wait while we prepare your assessment.</p>
      </section>
    </main>

    <script src="rpl-q3-app-window.js"></script>
    <script>
      const SOURCE_FILE = "AAMC RPL 2026.html";
      const WELCOME_VERSION = "V3.2";

      const replaceIfPresent = (text, matcher, replacement) => {
        if (!matcher.test(text)) {
          return text;
        }
        return text.replace(matcher, replacement);
      };

      const resolveSourceUrl = () => {
        try {
          return new URL(SOURCE_FILE, window.location.href).toString();
        } catch (error) {
          return SOURCE_FILE;
        }
      };

      const removeDebugPanelMarkup = (html) => {
        return html
          .replace(/<div class="checkResponseDebug"[\s\S]*?<\/pre>\s*<\/div>/g, "")
          .replace(/<div class="aiDebugPanel"[\s\S]*?<\/pre>\s*<\/div>/g, "");
      };

      const removeDebugFunctions = (html) => {
        let next = html;

        next = replaceIfPresent(
          next,
          /const clearCheckResponseDebug = \(message = "Waiting for Check Response\.\.\."\) => \{[\s\S]*?\n\s*};\n\s*const appendCheckResponseDebug = \(label, payload\) => \{[\s\S]*?\n\s*};/m,
          'const clearCheckResponseDebug = () => {};\n\n      const appendCheckResponseDebug = () => {};'
        );

        next = replaceIfPresent(
          next,
          /const withCheckResponseTiming = async \(label, task\) => \{[\s\S]*?\n\s*};/m,
          'const withCheckResponseTiming = async (_label, task) => task();'
        );

        next = next.replace(/\n\s*clearCheckResponseDebugBtn\?\.addEventListener\("click", \(\) => \{[\s\S]*?\n\s*\}\);/g, "");

        return next;
      };

      const patchParseListItems = (html) => {
        const replacement = `const parseListItems = (json) => {
        if (!json || (json.listitems === undefined && json.listItems === undefined && json.items === undefined)) {
          return { items: [], error: "Response does not include listitems." };
        }

        const raw = json.listitems ?? json.listItems ?? json.items;
        if (Array.isArray(raw)) {
          return { items: raw, error: raw.length ? null : "No questions returned." };
        }

        if (typeof raw === "string") {
          try {
            const parsed = JSON.parse(raw);
            if (!Array.isArray(parsed)) {
              return { items: [], error: "listitems is not an array." };
            }
            return { items: parsed, error: parsed.length ? null : "No questions returned." };
          } catch (parseError) {
            return { items: [], error: parseError?.message || String(parseError) };
          }
        }

        return { items: [], error: "Unsupported listitems payload shape." };
      };`;

        const existingPattern = /const parseListItems = \(json\) => \{[\s\S]*?\n\s*};/m;
        if (existingPattern.test(html)) {
          return html.replace(existingPattern, replacement);
        }

        const anchorPattern = /const fetchCurrentQuestionFromWebhook = async \(\) => \{/;
        const match = html.match(anchorPattern);
        if (!match || match.index === undefined) {
          return html;
        }

        return `${html.slice(0, match.index)}${replacement}\n\n${html.slice(match.index)}`;
      };

      const patchTimeouts = (html) => {
        let next = html;

        next = replaceIfPresent(
          next,
          /const response = await fetch\(questionsUrl, \{\n\s*method: "POST",\n\s*headers: \{ "Content-Type": "application\/json" \},\n\s*\}\);/,
          'const response = await fetchWithTimeout(questionsUrl, {\n          method: "POST",\n          headers: { "Content-Type": "application/json" },\n        }, 25000);'
        );

        next = replaceIfPresent(
          next,
          /const response = await fetch\(url, \{\n\s*method: "POST",\n\s*headers: \{ "Content-Type": "application\/json" \},\n\s*body: JSON\.stringify\(payload\),\n\s*\}\);/g,
          'const response = await fetchWithTimeout(url, {\n            method: "POST",\n            headers: { "Content-Type": "application/json" },\n            body: JSON.stringify(payload),\n          }, 30000);'
        );

        return next;
      };

      const patchTitle = (html) => {
        let next = html.replace(/<title>[\s\S]*?<\/title>/i, "<title>AAMC RPL Quiz - Q3</title>");
        next = next.replace(/AAMC RPL Quiz - V1\.0/g, "AAMC RPL Quiz - Q3");
        next = next.replace(/V3\.0-Ornith/g, "Q3");
        next = next.replace(/V2\.0/g, WELCOME_VERSION);
        next = next.replace(/V2\.1/g, WELCOME_VERSION);
        next = next.replace(/V2\.2/g, WELCOME_VERSION);
        next = next.replace(/V2\.3/g, WELCOME_VERSION);
        next = next.replace(/V2\.4/g, WELCOME_VERSION);
        next = next.replace(/V2\.5/g, WELCOME_VERSION);
        next = next.replace(/V2\.7/g, WELCOME_VERSION);
        next = next.replace(/V2\.8/g, WELCOME_VERSION);
        next = next.replace(/V2\.9/g, WELCOME_VERSION);
        return next;
      };

      const patchResponseClearOnAttempt = (html) => {
        return replaceIfPresent(
          html,
          /currentAttempts \+= 1;\n\s*currentResponses\.push\(answer\);\n\s*const currentQuestion = questions\[currentIndex\];/,
          'currentAttempts += 1;\n        currentResponses.push(answer);\n        answerInputEl.value = "";\n        const currentQuestion = questions[currentIndex];'
        );
      };

      const patchTranscriptPayloads = (html) => {
        let next = html;

        next = replaceIfPresent(
          next,
          /FullTranscript: fullTranscript,\n\s*FullTranscriptJSON: buildFullTranscriptJson\(\),/,
          'FullTranscript: buildFullTranscript(),\n          FullTranscriptJson: buildFullTranscriptJson(),\n          FullTranscriptJSON: buildFullTranscriptJson(),'
        );

        next = replaceIfPresent(
          next,
          /FullTranscript: fullTranscript \|\| buildFullTranscript\(\),\n\s*FullTranscriptJson: buildFullTranscriptJson\(\),/,
          'FullTranscript: buildFullTranscript(),\n              FullTranscriptJson: buildFullTranscriptJson(),\n              FullTranscriptJSON: buildFullTranscriptJson(),'
        );

        return next;
      };

      const removeDebugSectionStyles = (html) => {
        return html.replace(/\.checkResponseDebug\s*\{[\s\S]*?\}\s*\.checkResponseDebugHeader\s*\{[\s\S]*?\}\s*\.checkResponseDebugHeader button\s*\{[\s\S]*?\}\s*\.checkResponseDebugLog\s*\{[\s\S]*?\}\s*\.aiDebugPanel\s*\{[\s\S]*?\}\s*\.aiDebugPanelHeader\s*\{[\s\S]*?\}\s*\.aiDebugPanelHeader \.aiDebugTotals\s*\{[\s\S]*?\}\s*\.aiDebugPanelHeader button\s*\{[\s\S]*?\}\s*\.aiDebugLog\s*\{[\s\S]*?\}/, "");
      };

      const verifyTransformedHtml = (html) => {
        const required = [
          { label: "welcome screen", pattern: /<div id="welcomeScreen"/ },
          { label: "fetch timeout helper", pattern: /const fetchWithTimeout/ },
          { label: "list parser", pattern: /const parseListItems/ },
          { label: "transcript builder", pattern: /const buildFullTranscriptJson/ }
        ];

        const missing = required.filter((entry) => !entry.pattern.test(html)).map((entry) => entry.label);
        if (missing.length) {
          throw new Error(`Transformed page is missing required content: ${missing.join(", ")}`);
        }
      };

      const applyQ3Transforms = (html) => {
        let next = html;
        next = patchTitle(next);
        next = removeDebugPanelMarkup(next);
        next = removeDebugFunctions(next);
        next = removeDebugSectionStyles(next);
        next = patchParseListItems(next);
        next = patchTimeouts(next);
        next = patchResponseClearOnAttempt(next);
        next = patchTranscriptPayloads(next);
        verifyTransformedHtml(next);
        return next;
      };

      const renderAppLauncher = (appWindowRuntime) => {
        const appWindowUrl = appWindowRuntime.buildAppWindowUrl(
          window.location.href
        );
        document.body.innerHTML = `
          <main class="boot">
            <section class="bootCard">
              <h1 class="bootTitle">Open your RPL interview</h1>
              <p class="bootText">
                The interview will open in a separate, resizable application window.
              </p>
              <button class="bootAction" id="openRplInterview" type="button">
                Open the interview
              </button>
              <p class="bootStatus" id="rplLaunchStatus" role="status">
                Keep this page open while the interview window starts.
              </p>
            </section>
          </main>
        `;

        const launchButton = document.getElementById("openRplInterview");
        const status = document.getElementById("rplLaunchStatus");
        launchButton?.addEventListener("click", () => {
          const features = appWindowRuntime.buildPopupFeatures(
            window.screen?.availWidth,
            window.screen?.availHeight
          );
          const appWindow = window.open(
            appWindowUrl,
            appWindowRuntime.APP_WINDOW_NAME,
            features
          );
          if (!appWindow) {
            status.textContent =
              "The interview window was blocked. Allow pop-ups for this site, then press the button again.";
            status.classList.add("isError");
            return;
          }
          status.textContent =
            "The interview window is opening.";
          status.classList.remove("isError");
          appWindow.focus();
        });

        window.addEventListener("message", (event) => {
          if (
            event.origin !== window.location.origin ||
            event.data?.type !== appWindowRuntime.APP_WINDOW_MESSAGE_TYPE
          ) {
            return;
          }
          status.textContent =
            "Your interview is open in the application window. You may close this launcher page.";
          status.classList.remove("isError");
        });
      };

      const boot = async () => {
        try {
          const appWindowRuntime = window.RplQ3AppWindow;
          if (!appWindowRuntime) {
            throw new Error(
              "The application window could not be prepared. Please refresh the page."
            );
          }
          if (!appWindowRuntime.isAppWindowUrl(window.location.href)) {
            renderAppLauncher(appWindowRuntime);
            return;
          }
          const sourceUrl = resolveSourceUrl();
          const response = await fetch(sourceUrl, { cache: "no-store" });
          if (!response.ok) {
            throw new Error(`Failed to load source file: ${response.status} ${response.statusText}`);
          }
          const sourceHtml = await response.text();
          const q3Html = applyQ3Transforms(sourceHtml);
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage(
              { type: appWindowRuntime.APP_WINDOW_MESSAGE_TYPE },
              window.location.origin
            );
          }
          document.open();
          document.write(q3Html);
          document.close();
        } catch (error) {
          const message = error?.message || String(error);
          document.body.innerHTML = `\n            <main class="boot">\n              <section class="bootCard">\n                <h1 class="bootTitle">Q3 Load Failed</h1>\n                <p class="bootText">${message.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")}</p>\n              </section>\n            </main>\n          `;
        }
      };

      boot();
    </script>
  </body>
</html>
